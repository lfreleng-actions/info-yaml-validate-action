---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Unit tests for the validator itself ###
  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.4"

      - name: "Run pytest"
        shell: bash
        run: |
          # Run pytest
          uv run --no-config --frozen pytest -q

  ### The action ignores uv files in the checkout under test ###
  workspace-files:
    name: "Workspace .venv, .python-version and uv.toml"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 'uses: $/' has the runner fetch this action under _actions, as
      # for a published action, so the workspace is the caller's
      # checkout and not the action's directory. Planted here: a .venv
      # and a .python-version, each naming an interpreter that records
      # it ran and fails, which setup-uv's 'uv python find' and
      # 'uv run' would otherwise run, and a uv.toml naming an index
      # that does not resolve, read by 'uv sync'.
      # tests/test_action_workspace.py covers Python modules planted in
      # the workspace, and an action checked out inside it.
      - name: "Plant uv files in the workspace"
        shell: bash
        run: |
          # Plant uv files in the workspace
          marker="$RUNNER_TEMP/planted-ran"
          mkdir -p .venv/bin
          for interpreter in planted-python .venv/bin/python3 \
            .venv/bin/python; do
            cat > "$interpreter" <<EOF
          #!/bin/sh
          echo "\$0" >> "$marker"
          exit 97
          EOF
            chmod +x "$interpreter"
          done
          printf '%s\n' 'home = /usr/bin' \
            'include-system-site-packages = false' \
            'version_info = 3.12.0' > .venv/pyvenv.cfg
          printf '%s\n' "$GITHUB_WORKSPACE/planted-python" > .python-version
          cat > uv.toml <<'EOF'
          [[index]]
          url = "https://pypi.invalid/simple"
          default = true
          EOF

      - name: "Running local action: planted uv files"
        id: planted
        uses: $/
        with:
          path: "tests/fixtures/valid/INFO.yaml"
          project: "example-project"

      - name: "Verify real outputs and that nothing planted ran"
        if: always()
        shell: bash
        env:
          VALID: ${{ steps.planted.outputs.valid }}
          PROJECT: ${{ steps.planted.outputs.project }}
          REPOSITORIES: ${{ steps.planted.outputs.repositories }}
          SCHEMA_ERRORS: ${{ steps.planted.outputs.schema-error-count }}
          LINT_ERRORS: ${{ steps.planted.outputs.lint-error-count }}
        run: |
          # Verify real outputs and that nothing planted ran
          if [ -e "$RUNNER_TEMP/planted-ran" ]; then
            echo "Error: a planted file ran:" \
              "$(cat "$RUNNER_TEMP/planted-ran") ❌"
            exit 1
          fi
          if [ "$VALID" != "true" ] || [ "$PROJECT" != "example-project" ] \
            || [ "$REPOSITORIES" != "example-project" ] \
            || [ "$SCHEMA_ERRORS" != "0" ] || [ "$LINT_ERRORS" != "0" ]; then
            echo "Error: unexpected outputs: valid='$VALID'" \
              "project='$PROJECT' repositories='$REPOSITORIES'" \
              "schema-error-count='$SCHEMA_ERRORS'" \
              "lint-error-count='$LINT_ERRORS' ❌"
            exit 1
          fi
          echo "Planted uv files were ignored ✅"

  ### The caller's environment cannot pick the Python the action runs ###
  caller-env:
    name: "Caller environment (${{ matrix.os }}, ${{ matrix.selector }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        # 'request' names an interpreter outright; 'active-environment'
        # points at the workspace .venv as an activated one would.
        selector: [request, active-environment]
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        if: runner.os == 'Linux'
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      - name: 'Harden runner (block)'
        if: runner.os == 'Linux'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As a caller's earlier step could: bait in the workspace, and
      # settings exported through GITHUB_ENV that would have uv or
      # Python run it. Every bait records that it ran.
      - name: "Plant interpreters, modules and settings"
        shell: bash
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          # Plant interpreters, modules and settings
          marker="$RUNNER_TEMP/planted-ran"
          ws="$GITHUB_WORKSPACE"
          mkdir -p .venv/bin .venv/conda-meta xdg-bin pkg urllib
          for bait in .venv/bin/python .venv/bin/python3 \
            .venv/bin/python3.13 .venv/bin/uv xdg-bin/env xdg-bin/bash; do
            cat > "$bait" <<EOF
          #!/bin/sh
          echo "\$0" >> "$marker"
          exit 1
          EOF
            chmod +x "$bait"
          done
          printf '%s\n' 'home = /usr/bin' \
            'include-system-site-packages = false' \
            'version_info = 3.13.0' > .venv/pyvenv.cfg
          for module in json.py base64.py sitecustomize.py \
            usercustomize.py urllib/__init__.py; do
            printf 'with open("%s", "a") as handle:\n' "$marker" > "$module"
            printf '    handle.write(__file__ + "\\n")\n' >> "$module"
          done

          # The control: without isolation the bait runs
          PYTHONPATH="pkg:." python3 -c 'import json' || true
          PATH="$ws/.venv/bin:$PATH" python3 -c 'pass' || true
          if ! grep -q '/\.venv/bin/python3$' "$marker" ||
            ! grep -q '/json\.py$' "$marker"; then
            echo "Error: the planted bait did not run without isolation ❌"
            exit 1
          fi
          rm -f "$marker"

          arch="$(uname -m)"
          if [ "$arch" = "arm64" ]; then arch="aarch64"; fi
          {
            echo "PATH=$ws/.venv/bin:$PATH"
            echo "PYTHONPATH=pkg:."
            echo "PYTHONHOME=$ws/.venv"
            echo "PYTHONUSERBASE=$ws/.venv"
            echo "PYTHONSTARTUP=$ws/sitecustomize.py"
            echo "PYTHONEXECUTABLE=$ws/.venv/bin/python3"
            echo "__PYVENV_LAUNCHER__=$ws/.venv/bin/python3"
            echo "UV_NO_CACHE=1"
            echo "UV_PYTHON_ARCH=$arch"
            echo "UV_PYTHON_INSTALL_MIRROR=https://127.0.0.1:9"
            echo "XDG_BIN_HOME=$ws/xdg-bin"
            if [ "$SELECTOR" = "request" ]; then
              echo "UV_PYTHON=$ws/.venv/bin/python3"
              echo "UV_PYTHON_SEARCH_PATH=$ws/.venv/bin"
              echo "UV_PYTHON_INSTALL_DIR=$ws/uv-python"
              echo "UV_PYTHON_PREFERENCE=only-system"
            else
              # UV_PYTHON stays unset, so it cannot mask the
              # active-environment lookup.
              echo "VIRTUAL_ENV=$ws/.venv"
              echo "CONDA_PREFIX=$ws/.venv"
              echo "CONDA_DEFAULT_ENV=base"
              echo "UV_INTERNAL__PARENT_INTERPRETER=$ws/.venv/bin/python3"
              echo "UV_INTERNAL__TEST_PYTHON_MANAGED=1"
              echo "UV_CACHE_DIR=$ws/.uv-cache"
            fi
          } >> "$GITHUB_ENV"

      - name: "Running local action: cold"
        id: cold
        uses: $/
        with:
          path: "tests/fixtures/valid/INFO.yaml"
          project: "example-project"

      # The action's Python and environments now exist
      - name: "Running local action: warm"
        id: warm
        uses: $/
        with:
          path: "tests/fixtures/valid/INFO.yaml"
          project: "example-project"

      - name: "Verify real outputs and that no bait ran"
        if: always()
        shell: bash
        env:
          COLD: >-
            ${{ steps.cold.outputs.valid }}
            ${{ steps.cold.outputs.project }}
            ${{ steps.cold.outputs.repositories }}
            ${{ steps.cold.outputs.schema-error-count }}
            ${{ steps.cold.outputs.lint-error-count }}
          WARM: >-
            ${{ steps.warm.outputs.valid }}
            ${{ steps.warm.outputs.project }}
            ${{ steps.warm.outputs.repositories }}
            ${{ steps.warm.outputs.schema-error-count }}
            ${{ steps.warm.outputs.lint-error-count }}
        run: |
          # Verify real outputs and that no bait ran
          status=0
          if [ -e "$RUNNER_TEMP/planted-ran" ]; then
            echo "Error: planted bait ran:" \
              "$(cat "$RUNNER_TEMP/planted-ran") ❌"
            status=1
          fi
          case ":$PATH:" in
            *":$GITHUB_WORKSPACE/xdg-bin:"*)
              echo "Error: the caller's XDG_BIN_HOME is on PATH ❌"
              status=1 ;;
          esac
          expected="true example-project example-project 0 0"
          for run in COLD WARM; do
            if [ "${!run}" != "$expected" ]; then
              echo "Error: unexpected $run outputs: '${!run}' ❌"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "The caller's environment chose nothing ✅"
          fi
          exit "$status"

  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A file that satisfies both checks.
      - name: "Running local action: valid INFO.yaml"
        id: valid
        uses: $/
        with:
          path: "tests/fixtures/valid/INFO.yaml"
          project: "example-project"

      - name: "Verify outputs from the valid case"
        shell: bash
        env:
          VALID: ${{ steps.valid.outputs.valid }}
          PROJECT: ${{ steps.valid.outputs.project }}
          REPOSITORIES: ${{ steps.valid.outputs.repositories }}
          ERRORS: ${{ steps.valid.outputs.schema-error-count }}
        run: |
          # Verify outputs from the valid case
          if [ "$VALID" != "true" ]; then
            echo "Error: expected valid=true, got '$VALID' ❌"
            exit 1
          fi
          if [ "$PROJECT" != "example-project" ]; then
            echo "Error: expected project=example-project, got '$PROJECT' ❌"
            exit 1
          fi
          if [ "$REPOSITORIES" != "example-project" ]; then
            echo "Error: unexpected repositories output: '$REPOSITORIES' ❌"
            exit 1
          fi
          if [ "$ERRORS" != "0" ]; then
            echo "Error: expected 0 schema errors, got '$ERRORS' ❌"
            exit 1
          fi
          echo "Valid case produced the expected outputs ✅"

      # The ancestor rule: a subproject may name its parent project.
      - name: "Running local action: ancestor repository"
        id: ancestor
        uses: $/
        with:
          path: "tests/fixtures/valid/INFO.yaml"
          project: "example-project/subcomponent"

      - name: "Verify the ancestor case passed"
        shell: bash
        env:
          VALID: ${{ steps.ancestor.outputs.valid }}
        run: |
          # Verify the ancestor case passed
          if [ "$VALID" != "true" ]; then
            echo "Error: ancestor repository should be accepted ❌"
            exit 1
          fi
          echo "Ancestor repository accepted ✅"

      # Schema violations must fail the step.
      - name: "Running local action: schema violations [expect failure]"
        id: bad_schema
        uses: $/
        continue-on-error: true
        with:
          path: "tests/fixtures/invalid-schema/INFO.yaml"
          project: "example-project"

      - name: "Error if the schema violation did NOT fail"
        if: steps.bad_schema.outcome == 'success'
        shell: bash
        run: |
          # Error if the schema violation did NOT fail
          echo "Error: invalid schema was reported as valid ❌"
          exit 1

      # A mismatched repository must fail the step.
      - name: "Running local action: wrong repository [expect failure]"
        id: bad_repo
        uses: $/
        continue-on-error: true
        with:
          path: "tests/fixtures/wrong-repository/INFO.yaml"
          project: "example-project"

      - name: "Error if the repository mismatch did NOT fail"
        if: steps.bad_repo.outcome == 'success'
        shell: bash
        run: |
          # Error if the repository mismatch did NOT fail
          echo "Error: mismatched repository was reported as valid ❌"
          exit 1

      # The same file passes when the repository check is disabled,
      # proving the toggle acts on the repository check alone.
      - name: "Running local action: repository check disabled"
        id: no_repo_check
        uses: $/
        with:
          path: "tests/fixtures/wrong-repository/INFO.yaml"
          require-repository-match: "false"

      - name: "Verify the disabled check passed and said so"
        shell: bash
        env:
          VALID: ${{ steps.no_repo_check.outputs.valid }}
          PROJECT: ${{ steps.no_repo_check.outputs.project }}
        run: |
          # Verify the disabled check passed and said so
          if [ "$VALID" != "true" ]; then
            echo "Error: schema-only validation should pass ❌"
            exit 1
          fi
          if [ -n "$PROJECT" ]; then
            echo "Error: project should be empty when the check is skipped ❌"
            exit 1
          fi
          echo "Repository check skipped as requested ✅"

      # A schema-valid file that breaks yamllint must fail the step.
      - name: "Running local action: yamllint findings [expect failure]"
        id: bad_lint
        uses: $/
        continue-on-error: true
        with:
          path: "tests/fixtures/lint-failure/INFO.yaml"
          project: "example-project"

      - name: "Verify the lint findings failed the step"
        shell: bash
        env:
          OUTCOME: ${{ steps.bad_lint.outcome }}
          VALID: ${{ steps.bad_lint.outputs.valid }}
          LINT_ERRORS: ${{ steps.bad_lint.outputs.lint-error-count }}
          SCHEMA_ERRORS: ${{ steps.bad_lint.outputs.schema-error-count }}
        run: |
          # Verify the lint findings failed the step
          if [ "$OUTCOME" = "success" ] || [ "$VALID" != "false" ]; then
            echo "Error: yamllint findings were reported as valid ❌"
            exit 1
          fi
          if [ "$LINT_ERRORS" != "2" ] || [ "$SCHEMA_ERRORS" != "0" ]; then
            echo "Error: expected 2 lint and 0 schema errors," \
              "got '$LINT_ERRORS' and '$SCHEMA_ERRORS' ❌"
            exit 1
          fi
          echo "yamllint findings failed the step ✅"

      # The same file passes with the lint stage switched off.
      - name: "Running local action: lint stage disabled"
        id: no_lint
        uses: $/
        with:
          path: "tests/fixtures/lint-failure/INFO.yaml"
          project: "example-project"
          lint-yaml: "false"

      - name: "Verify the disabled lint stage passed"
        shell: bash
        env:
          VALID: ${{ steps.no_lint.outputs.valid }}
          LINT_ERRORS: ${{ steps.no_lint.outputs.lint-error-count }}
        run: |
          # Verify the disabled lint stage passed
          if [ "$VALID" != "true" ] || [ "$LINT_ERRORS" != "0" ]; then
            echo "Error: lint-yaml: false should skip the lint stage ❌"
            exit 1
          fi
          echo "Lint stage skipped as requested ✅"

      # A missing file must fail rather than pass vacuously.
      - name: "Running local action: absent file [expect failure]"
        id: absent
        uses: $/
        continue-on-error: true
        with:
          path: "tests/fixtures/does-not-exist/INFO.yaml"
          project: "example-project"

      - name: "Error if the absent file did NOT fail"
        if: steps.absent.outcome == 'success'
        shell: bash
        run: |
          # Error if the absent file did NOT fail
          echo "Error: a missing INFO.yaml was reported as valid ❌"
          exit 1

      # A path escaping the workspace must be refused.
      - name: "Running local action: path traversal [expect failure]"
        id: traversal
        uses: $/
        continue-on-error: true
        with:
          path: "../../../etc/hostname"
          project: "example-project"

      - name: "Error if path traversal did NOT fail"
        if: steps.traversal.outcome == 'success'
        shell: bash
        run: |
          # Error if path traversal did NOT fail
          echo "Error: a path outside the workspace was accepted ❌"
          exit 1

      # A malformed boolean must fail rather than quietly disable the gate.
      - name: "Running local action: malformed boolean [expect failure]"
        id: typo
        uses: $/
        continue-on-error: true
        with:
          path: "tests/fixtures/wrong-repository/INFO.yaml"
          project: "example-project"
          require-repository-match: "enabled"

      - name: "Error if the malformed boolean did NOT fail"
        if: steps.typo.outcome == 'success'
        shell: bash
        run: |
          # Error if the malformed boolean did NOT fail
          echo "Error: a malformed boolean silently disabled the check ❌"
          exit 1

      - name: "Verify a fatal error still publishes outputs"
        shell: bash
        env:
          VALID: ${{ steps.absent.outputs.valid }}
        run: |
          # Verify a fatal error still publishes outputs
          if [ "$VALID" != "false" ]; then
            echo "Error: expected valid=false after a fatal error," \
              "got '$VALID' ❌"
            exit 1
          fi
          echo "Fatal error published valid=false ✅"

      - name: "All action tests passed"
        shell: bash
        run: |
          # All action tests passed
          echo "All action tests passed ✅"
          echo "All action tests passed ✅" >> "$GITHUB_STEP_SUMMARY"
