# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Unit tests for the validator itself ###
  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a  # v0.12.1
        with:
          config: '@18d9c4446bea555d0783e850f6d295f844fe8f67'  # v0.1.1

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.23"

      - name: "Run pytest"
        shell: bash
        run: |
          # Run pytest
          uv run --frozen pytest -q

  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a  # v0.12.1
        with:
          config: '@18d9c4446bea555d0783e850f6d295f844fe8f67'  # v0.1.1

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A file that satisfies both checks.
      - name: "Running local action: valid INFO.yaml"
        id: valid
        uses: ./
        with:
          path: "tests/fixtures/valid/INFO.yaml"
          project: "example-project"

      - name: "Verify outputs from the valid case"
        shell: bash
        env:
          VALID: ${{ steps.valid.outputs.valid }}
          PROJECT: ${{ steps.valid.outputs.project }}
          REPOSITORIES: ${{ steps.valid.outputs.repositories }}
          ERRORS: ${{ steps.valid.outputs.schema-error-count }}
        run: |
          # Verify outputs from the valid case
          if [ "$VALID" != "true" ]; then
            echo "Error: expected valid=true, got '$VALID' ❌"
            exit 1
          fi
          if [ "$PROJECT" != "example-project" ]; then
            echo "Error: expected project=example-project, got '$PROJECT' ❌"
            exit 1
          fi
          if [ "$REPOSITORIES" != "example-project" ]; then
            echo "Error: unexpected repositories output: '$REPOSITORIES' ❌"
            exit 1
          fi
          if [ "$ERRORS" != "0" ]; then
            echo "Error: expected 0 schema errors, got '$ERRORS' ❌"
            exit 1
          fi
          echo "Valid case produced the expected outputs ✅"

      # The ancestor rule: a subproject may name its parent project.
      - name: "Running local action: ancestor repository"
        id: ancestor
        uses: ./
        with:
          path: "tests/fixtures/valid/INFO.yaml"
          project: "example-project/subcomponent"

      - name: "Verify the ancestor case passed"
        shell: bash
        env:
          VALID: ${{ steps.ancestor.outputs.valid }}
        run: |
          # Verify the ancestor case passed
          if [ "$VALID" != "true" ]; then
            echo "Error: ancestor repository should be accepted ❌"
            exit 1
          fi
          echo "Ancestor repository accepted ✅"

      # Schema violations must fail the step.
      - name: "Running local action: schema violations [expect failure]"
        id: bad_schema
        uses: ./
        continue-on-error: true
        with:
          path: "tests/fixtures/invalid-schema/INFO.yaml"
          project: "example-project"

      - name: "Error if the schema violation did NOT fail"
        if: steps.bad_schema.outcome == 'success'
        shell: bash
        run: |
          # Error if the schema violation did NOT fail
          echo "Error: invalid schema was reported as valid ❌"
          exit 1

      # A mismatched repository must fail the step.
      - name: "Running local action: wrong repository [expect failure]"
        id: bad_repo
        uses: ./
        continue-on-error: true
        with:
          path: "tests/fixtures/wrong-repository/INFO.yaml"
          project: "example-project"

      - name: "Error if the repository mismatch did NOT fail"
        if: steps.bad_repo.outcome == 'success'
        shell: bash
        run: |
          # Error if the repository mismatch did NOT fail
          echo "Error: mismatched repository was reported as valid ❌"
          exit 1

      # The same file passes when the repository check is disabled,
      # proving the toggle acts on the repository check alone.
      - name: "Running local action: repository check disabled"
        id: no_repo_check
        uses: ./
        with:
          path: "tests/fixtures/wrong-repository/INFO.yaml"
          require-repository-match: "false"

      - name: "Verify the disabled check passed and said so"
        shell: bash
        env:
          VALID: ${{ steps.no_repo_check.outputs.valid }}
          PROJECT: ${{ steps.no_repo_check.outputs.project }}
        run: |
          # Verify the disabled check passed and said so
          if [ "$VALID" != "true" ]; then
            echo "Error: schema-only validation should pass ❌"
            exit 1
          fi
          if [ -n "$PROJECT" ]; then
            echo "Error: project should be empty when the check is skipped ❌"
            exit 1
          fi
          echo "Repository check skipped as requested ✅"

      # A missing file must fail rather than pass vacuously.
      - name: "Running local action: absent file [expect failure]"
        id: absent
        uses: ./
        continue-on-error: true
        with:
          path: "tests/fixtures/does-not-exist/INFO.yaml"
          project: "example-project"

      - name: "Error if the absent file did NOT fail"
        if: steps.absent.outcome == 'success'
        shell: bash
        run: |
          # Error if the absent file did NOT fail
          echo "Error: a missing INFO.yaml was reported as valid ❌"
          exit 1

      # A path escaping the workspace must be refused.
      - name: "Running local action: path traversal [expect failure]"
        id: traversal
        uses: ./
        continue-on-error: true
        with:
          path: "../../../etc/hostname"
          project: "example-project"

      - name: "Error if path traversal did NOT fail"
        if: steps.traversal.outcome == 'success'
        shell: bash
        run: |
          # Error if path traversal did NOT fail
          echo "Error: a path outside the workspace was accepted ❌"
          exit 1

      # A malformed boolean must fail rather than quietly disable the gate.
      - name: "Running local action: malformed boolean [expect failure]"
        id: typo
        uses: ./
        continue-on-error: true
        with:
          path: "tests/fixtures/wrong-repository/INFO.yaml"
          project: "example-project"
          require-repository-match: "enabled"

      - name: "Error if the malformed boolean did NOT fail"
        if: steps.typo.outcome == 'success'
        shell: bash
        run: |
          # Error if the malformed boolean did NOT fail
          echo "Error: a malformed boolean silently disabled the check ❌"
          exit 1

      - name: "Verify a fatal error still publishes outputs"
        shell: bash
        env:
          VALID: ${{ steps.absent.outputs.valid }}
        run: |
          # Verify a fatal error still publishes outputs
          if [ "$VALID" != "false" ]; then
            echo "Error: expected valid=false after a fatal error," \
              "got '$VALID' ❌"
            exit 1
          fi
          echo "Fatal error published valid=false ✅"

      - name: "All action tests passed"
        shell: bash
        run: |
          # All action tests passed
          echo "All action tests passed ✅"
          echo "All action tests passed ✅" >> "$GITHUB_STEP_SUMMARY"
