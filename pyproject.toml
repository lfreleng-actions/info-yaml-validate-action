[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "info-yaml-validate-action"
version = "0.0.0"
description = "Validate INFO.yaml against a schema and its declared repository"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["jsonschema[format-nongpl]>=4.23", "PyYAML>=6", "referencing>=0.36"]

# A [tool.uv] table here does not apply when the action runs: it
# calls uv with --no-config (see AGENTS.md).

[project.scripts]
info-yaml-validate = "info_yaml.cli:main"

[dependency-groups]
# yamllint is GPL-3.0 and is not a runtime dependency: the action runs the
# packaged command as a separate process and imports nothing from it. The
# 'lint' group exists so the action can install that command on its own,
# locked and hash-checked through uv.lock, which Dependabot keeps current;
# the tests need the same command on PATH, which 'uv run' provides.
lint = ["yamllint>=1.35"]
dev = ["pytest>=8", { include-group = "lint" }]

[tool.hatch.build.targets.wheel]
packages = ["info_yaml"]

# The schema lives at the repository root, where the action reads it; a
# wheel carries a copy inside the package, where info_yaml.validate
# looks first.
[tool.hatch.build.targets.wheel.force-include]
"schema/info-schema.yaml" = "info_yaml/info-schema.yaml"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

[tool.basedpyright]
# The minimum from requires-python.
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
# Matches the paths the pre-commit hook passes, so a bare basedpyright
# run or an editor's language server analyses the same set.
include = ["info_yaml", "info_yaml_validate.py", "tests"]
