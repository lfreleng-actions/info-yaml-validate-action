[project]
name = "info-yaml-validate-action"
version = "0.0.0"
description = "Validate INFO.yaml against a schema and its declared repository"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23", "PyYAML>=6", "referencing>=0.36"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

[tool.basedpyright]
# The minimum from requires-python.
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
# Matches the paths the pre-commit hook passes, so a bare basedpyright
# run or an editor's language server analyses the same set.
include = ["info_yaml", "info_yaml_validate.py", "tests"]
