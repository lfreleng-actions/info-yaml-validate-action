---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

name: "📋 INFO.yaml Validate"
description: >
  Lint an INFO.yaml file with yamllint, validate it against a JSON schema
  and verify that the repositories it declares match the project it
  describes.

inputs:
  path:
    description: >
      Workspace-relative path to the INFO.yaml file. Defaults to
      'INFO.yaml' at the repository root.
    required: false
    default: "INFO.yaml"
  project:
    description: >
      Project name the INFO.yaml must describe, such as
      'integration/distribution'. When empty, the value is read from the
      '[gerrit] project' key in .gitreview, with any '.git' suffix
      removed. Ignored when 'require-repository-match' is 'false'.
    required: false
    default: ""
  schema-path:
    description: >
      Workspace-relative path to an alternative JSON schema. When empty,
      the copy of info-schema.yaml bundled with this action is used. The
      path must resolve inside the workspace.
    required: false
    default: ""
  require-repository-match:
    description: >
      When 'true' (default), every entry under 'repositories' must name
      the project itself or an ancestor of it. Set to 'false' to run
      schema validation alone.
    required: false
    default: "true"
  lint-yaml:
    description: >
      When 'true' (default), run yamllint over the INFO.yaml before schema
      validation, using the workspace's .yamllint, .yamllint.yaml or
      .yamllint.yml, or yamllint's 'default' configuration when none
      exists. Error-level findings fail the step; warnings do not. Set to
      'false' to skip the lint stage.
    required: false
    default: "true"

outputs:
  valid:
    description: >
      'true' when every enabled check passed, otherwise 'false'. A
      check switched off through 'lint-yaml' or
      'require-repository-match' does not run, so 'true' reports on the
      remaining checks alone.
    value: ${{ steps.validate.outputs.valid }}
  project:
    description: >
      The project name used for the repository check; empty when the
      check was skipped.
    value: ${{ steps.validate.outputs.project }}
  repositories:
    description: >
      Newline-separated list of repositories declared in the INFO.yaml.
    value: ${{ steps.validate.outputs.repositories }}
  schema-error-count:
    description: "Number of schema violations found."
    value: ${{ steps.validate.outputs.schema-error-count }}
  lint-error-count:
    description: >
      Number of error-level yamllint findings; '0' when the lint stage
      was skipped.
    value: ${{ steps.validate.outputs.lint-error-count }}

runs:
  using: "composite"
  steps:
    - name: "Install uv"
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.4"
    - name: "Install yamllint"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        # yamllint is GPL-3.0 licensed, so it is installed on its own and
        # run as a separate process; the validator imports nothing from
        # it, and the script lock it runs under does not list it. The
        # 'lint' dependency group holds it, so the install is locked and
        # hash-checked through uv.lock, which Dependabot keeps current.
        # A private environment: the install neither collides with nor
        # overwrites a yamllint the runner already has.
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/info-yaml-validate/lint
      run: |
        # Install the locked yamllint into a private environment
        uv sync --locked --only-group lint --no-install-project \
          --project "${ACTION_PATH}"
    - name: "Validate INFO.yaml"
      id: validate
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_SCHEMA_PATH: ${{ inputs.schema-path }}
        INPUT_REQUIRE_REPOSITORY_MATCH: ${{ inputs.require-repository-match }}
        INPUT_LINT_YAML: ${{ inputs.lint-yaml }}
        ACTION_PATH: ${{ github.action_path }}
        # The validator takes yamllint from this environment and nowhere
        # else: a PATH search would let a 'yamllint' in the checkout under
        # test win on Windows, where the current directory is searched.
        YAMLLINT_ENV_DIR: ${{ runner.temp }}/info-yaml-validate/lint
      run: |
        # Validate the consumer's checked-out repository (the workspace),
        # running the script from this action's own checkout so the
        # bundled schema resolves beside it.
        cd "$GITHUB_WORKSPACE"
        uv run --locked --script "${ACTION_PATH}/info_yaml_validate.py"
